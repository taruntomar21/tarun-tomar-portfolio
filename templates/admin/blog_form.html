{% extends 'admin/base.html' %}{% block admin_content %}<form class="panel form-stack" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for name,label,maximum in [('title','Article title',180),('slug','URL slug',200),('category','Category',100)] %}<div><label for="{{ name }}">{{ label }}</label><input id="{{ name }}" name="{{ name }}" value="{{ post|attr(name) or '' }}" maxlength="{{ maximum }}" {% if name in ['title','slug'] %}required{% endif %}></div>{% endfor %}<div><label for="summary">Summary</label><textarea id="summary" name="summary" rows="3" maxlength="500">{{ post.summary or '' }}</textarea></div><div><label for="body">Article body — safe plain text, with line breaks</label><textarea id="body" name="body" rows="20" maxlength="100000">{{ post.body or '' }}</textarea></div><div><label for="tags">Tags, comma-separated</label><input id="tags" name="tags" value="{{ post.tags|join(', ') if post.tags else '' }}"></div><div><label for="thumbnail">Thumbnail</label>{% if post.thumbnail_id %}<img class="admin-preview" src="{{ url_for('main.media',asset_id=post.thumbnail_id) }}" alt="Article thumbnail"><label class="checkbox"><input name="remove_thumbnail" type="checkbox" value="true">Remove current thumbnail</label>{% endif %}<input id="thumbnail" name="thumbnail" type="file" accept="image/jpeg,image/png,image/webp" data-preview="blog-preview"><div id="blog-preview" class="upload-previews"></div></div><div><label for="status">Publication status</label><select id="status" name="status"><option value="draft" {% if post.status=='draft' %}selected{% endif %}>Draft</option><option value="published" {% if post.status=='published' %}selected{% endif %}>Published</option></select></div><div class="button-row"><button class="button primary">Save article</button><a class="button secondary" href="/admin/blog">Cancel</a></div></form>{% endblock %}
