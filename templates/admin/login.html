{% extends 'base.html' %}{% block head %}<meta name="robots" content="noindex,nofollow">{% endblock %}{% block content %}<section class="container login-section"><form class="panel form-stack login-form" method="post"><span class="square-icon"><i data-lucide="lock-keyhole"></i></span><p class="eyebrow">PORTFOLIO STUDIO</p><h1>Welcome back.</h1><p class="muted">Sign in to manage your portfolio.</p><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><label for="email">Admin email</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required></div><div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="512" required></div><button class="button primary" type="submit">Sign in <i data-lucide="arrow-right"></i></button><p class="small muted">Admin accounts are created through the server CLI. Public registration is disabled.</p></form></section>{% endblock %}
