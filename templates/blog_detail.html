{% extends 'base.html' %}{% block content %}<article class="container"><header class="page-intro"><a class="text-link" href="/blog">← All articles</a><p class="eyebrow">{{ post.category }} · {{ post.published_at|date }}</p><h1>{{ post.title }}</h1><p class="lead">{{ post.summary }}</p><div class="tags">{% for t in post.tags %}<span class="tag">{{ t }}</span>{% endfor %}</div></header>{% if post.thumbnail_id %}<img class="detail-cover" src="{{ url_for('main.media',asset_id=post.thumbnail_id) }}" alt="{{ post.title }}" width="1200" height="750">{% endif %}<div class="prose project-prose section-topless"><p class="pre-line">{{ post.body }}</p></div></article>{% endblock %}
