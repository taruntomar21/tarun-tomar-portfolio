
services:
  - type: web
    name: tarun-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: RATELIMIT_STORAGE_URI
        value: memory://

      - key: STORAGE_BACKEND
        value: local

      - key: TRUST_PROXY
        value: "true"

      - key: SITE_URL
        sync: false
